# agents/backend_dev/agent.yaml
#
# Definição portável do agente — {{company_id}} é resolvido pelo instalador
# na hora de criar o agente numa company TwinForge real. reports_to usa a chave
# de papel (não um id cru) — o instalador resolve pra o id real já criado,
# exceto "po", que nunca é criado por este instalador: toda company TwinForge
# já tem seu próprio PO; o instalador só aponta pra ele.

role_key: backend_dev
name: "Magento Backend Developer"
role: engineer  # enum nativo do TwinForge (pm, engineer, ceo, qa, devops, general)
title: "Magento Backend Developer"
icon: code
reports_to: tech_lead

adapter_type: pi_local  # pi_local | crucible_local — ver README deste diretório
adapter_config:
  model: air-bizapps/twinforge-coder  # pi_local exige o id com prefixo do provedor (sem ele: adapter_failed)

runtime_config:
  heartbeat:
    enabled: false
    wake_on_demand: true
    max_concurrent_runs: 5

budget_monthly_cents: 15000  # nunca 0 — ver reference_budget_monthly_cents_zero_bug

permissions:
  can_assign_tasks: true
  can_create_agents: false
  can_create_skills: true

desired_skills:
  - company/{{company_id}}/adobe-commerce-standards
  - company/{{company_id}}/adobe-magento-backend-standards
  - company/{{company_id}}/bunge-backend-code-quality
  - company/{{company_id}}/projeto-engineering-practices
  - company/{{company_id}}/adobe-magento-toolbox
  - company/{{company_id}}/engineering-memory
  - company/{{company_id}}/adobe-magento-ui-component-developer
  - company/{{company_id}}/adobe-create-unit-tests
  - company/{{company_id}}/adobe-create-entity
  - company/{{company_id}}/adobe-create-repository
  - company/{{company_id}}/adobe-create-controller
  - company/{{company_id}}/adobe-create-config
  - company/{{company_id}}/adobe-create-cronjob
  - company/{{company_id}}/adobe-create-plugin
  - company/{{company_id}}/adobe-create-queue
  - company/{{company_id}}/adobe-create-import-entity
  - company/{{company_id}}/adobe-inject-validator
  - company/{{company_id}}/adobe-inject-custom-logger
  - company/{{company_id}}/adobe-inject-debug-logger
  - company/{{company_id}}/adobe-create-http-client
  - company/{{company_id}}/link-verification
  - company/{{company_id}}/adobe-magento-uicomponent-debug
  - company/{{company_id}}/projeto-openspec-flow
  - company/{{company_id}}/projeto-subtask-contract
  - company/{{company_id}}/openspec-review-proposal
  - company/{{company_id}}/openspec-apply-change
  - company/{{company_id}}/projeto-domain-lookup
  - company/{{company_id}}/adobe-run-unit-tests
  - air-bizapps/agentes-forjados/blocked-exige-blocker-declarado
  - company/{{company_id}}/adobe-magento-module-developer
  - company/{{company_id}}/adobe-magento-feature-developer
  - company/{{company_id}}/adobe-magento-model-developer
  - company/{{company_id}}/adobe-magento-php-specialist
  - company/{{company_id}}/adobe-magento-xml-specialist
  - company/{{company_id}}/adobe-magento-api-developer
  - company/{{company_id}}/adobe-magento-cronjob-developer
  - company/{{company_id}}/adobe-magento-configuration-specialist
  - company/{{company_id}}/adobe-magento-index-analyst
  - company/{{company_id}}/adobe-magento-catalog-specialist
  - company/{{company_id}}/adobe-magento-order-specialist
  - company/{{company_id}}/adobe-magento-issue-debugger
  - company/{{company_id}}/adobe-magento-security-analyst
  - company/{{company_id}}/adobe-magento-performance-analyst
  - company/{{company_id}}/adobe-magento-cache-analyst

instructions:
  entry_file: AGENTS.md
  files:
    - AGENTS.md
    - CONTEXT.md
    - HEARTBEAT.md
    - SOUL.md
    - TOOLS.md
