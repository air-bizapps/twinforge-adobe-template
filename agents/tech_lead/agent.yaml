# agents/tech_lead/agent.yaml
#
# Definição portável do agente — {{company_id}} é resolvido pelo instalador
# na hora de criar o agente numa company TwinForge real. reports_to usa a chave
# de papel (não um id cru) — o instalador resolve pra o id real já criado,
# exceto "po", que nunca é criado por este instalador: toda company TwinForge
# já tem seu próprio PO; o instalador só aponta pra ele.

role_key: tech_lead
name: "Tech Lead"
role: pm  # enum nativo do TwinForge (pm, engineer, ceo, qa, devops, general)
title: "Tech Lead"
icon: puzzle
reports_to: po

adapter_type: pi_local  # pi_local | crucible_local — ver README deste diretório
adapter_config:
  model: air-bizapps/twinforge-coder
  thinking: high

runtime_config:
  heartbeat:
    enabled: false
    wake_on_demand: true
    max_concurrent_runs: 20

budget_monthly_cents: 15000  # nunca 0 — ver reference_budget_monthly_cents_zero_bug

permissions:
  can_create_agents: false
  can_create_skills: true

desired_skills:
  - company/{{company_id}}/adobe-requirements-refinement-fundamentals
  - company/{{company_id}}/adobe-commerce-standards
  - company/{{company_id}}/adobe-magento-backend-standards
  - company/{{company_id}}/adobe-magento-frontend-standards
  - company/{{company_id}}/bunge-backend-code-quality
  - company/{{company_id}}/bunge-frontend-code-quality
  - company/{{company_id}}/bunge-engineering-practices
  - company/{{company_id}}/adobe-magento-toolbox
  - company/{{company_id}}/bunge-backlog-item
  - company/{{company_id}}/adobe-srs
  - company/{{company_id}}/bunge-link-verification
  - company/{{company_id}}/bunge-figma-layout-decomposition
  - company/{{company_id}}/bunge-openspec-flow
  - company/{{company_id}}/bunge-card-curation
  - company/{{company_id}}/bunge-subtask-contract
  - company/{{company_id}}/openspec-explore
  - company/{{company_id}}/bunge-domain-lookup
  - company/{{company_id}}/adobe-run-unit-tests
  - company/{{company_id}}/bunge-vague-demand-triage
  - air-bizapps/agentes-forjados/blocked-exige-blocker-declarado
  - company/{{company_id}}/adobe-magento-code-reviewer
  - company/{{company_id}}/adobe-magento-catalog-specialist
  - company/{{company_id}}/adobe-magento-order-specialist

instructions:
  entry_file: AGENTS.md
  files:
    - AGENTS.md
    - CONTEXT.md
